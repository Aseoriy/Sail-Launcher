name: Build

# Builds the Windows installer and the Linux packages. A tag push also creates a
# DRAFT release (marked pre-release when the tag has a suffix such as -beta.1),
# so nothing becomes public until it is reviewed and published by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run install:electron
      - name: Syntax check
        run: node --check main.js
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  linux:
    # Built on the oldest supported Ubuntu so the native helper only needs an old glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run install:electron
      - run: npm run rebuild:linux
      - name: Syntax check
        run: node --check main.js
      - run: npm run build:linux
      - name: Native helper glibc requirement
        run: objdump -T native/linux/x64/sail-native | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags="--draft"
          case "$TAG" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "$TAG" $flags --repo "$GITHUB_REPOSITORY" --title "Sail Launcher ${TAG#v}" \
            --notes "Draft created by CI. Add the changelog, then publish." artifacts/*/*
