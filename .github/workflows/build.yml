name: Build

# Builds the Windows installer and the Linux packages and keeps them as workflow
# artifacts. Releases are created by hand from the owner's account with those files,
# so nothing becomes public until it is reviewed and published.
on:
  push:
    tags: ['[0-9]*', 'v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run install:electron
      - name: Syntax check
        run: node --check main.js
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          retention-days: 3
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  linux:
    # Built on the oldest supported Ubuntu so the native helper only needs an old glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run install:electron
      - run: npm run rebuild:linux
      - name: Syntax check
        run: node --check main.js
      - name: Install the rpm packaging tool
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm run build:linux:all
      - name: Native helper glibc requirement
        run: objdump -T native/linux/x64/sail-native | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          retention-days: 3
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/latest-linux.yml

