<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sail verification code</title>
</head>
<body style="margin:0;background:#f4f4f7;font-family:Segoe UI,Arial,sans-serif;color:#17172b;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#f4f4f7;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 14px 40px rgba(24,24,39,.12);">
          <tr>
            <td align="center" style="padding:28px;background:#171733;color:#ffffff;">
              <div style="font-size:28px;line-height:1;">&#9973;</div>
              <div style="margin-top:8px;font-size:18px;font-weight:700;">Sail Launcher</div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:34px 30px 30px;">
              <h1 style="margin:0 0 10px;font-size:22px;">Your verification code</h1>
              <p style="margin:0 0 22px;color:#66667a;font-size:14px;line-height:1.55;">
                Enter this one-time code in Sail Launcher, or use the button below when verifying an action on Sail Hub.
              </p>
              <div style="display:inline-block;padding:14px 22px;border:1px solid #d9ccff;border-radius:10px;background:#f5f0ff;color:#7138d7;font-family:Consolas,monospace;font-size:25px;font-weight:800;letter-spacing:7px;">
                {{ .Token }}
              </div>
              <div style="margin-top:24px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;border-radius:9px;background:#8546df;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;">
                  Verify on Sail Hub
                </a>
              </div>
              <p style="margin:22px 0 0;color:#8a8a9a;font-size:12px;line-height:1.5;">
                This code and link expire shortly and can only be used once. If you did not request this, you can ignore this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
